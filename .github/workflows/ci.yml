name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ReadTheRules-Gustavo_H/apps/backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpassword
          POSTGRES_DB: readtherules
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://admin:adminpassword@localhost:5432/readtherules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ReadTheRules-Gustavo_H/apps/backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy # garante que as migrations rodam num banco limpo
      - run: npm run typecheck
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ReadTheRules-Gustavo_H/apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ReadTheRules-Gustavo_H/apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
