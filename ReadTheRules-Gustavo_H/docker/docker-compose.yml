services:
  db:
    image: ankane/pgvector:latest
    container_name: rtr_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: readtherules
    ports:
      - "5432:5432"
    volumes:
      - rtr_db_data:/var/lib/postgresql/data

  # Opcional: `docker compose up -d db` sobe só o banco (para rodar o backend com npm run dev).
  backend:
    build: ../apps/backend
    depends_on: [db]
    ports:
      - "3000:3000"
    env_file: ../apps/backend/.env
    environment:
      DATABASE_URL: postgresql://admin:adminpassword@db:5432/readtherules

volumes:
  rtr_db_data: {}
